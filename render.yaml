services:
  - type: web
    name: tailortalk-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false          # set manually in Render dashboard
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false          # set manually in Render dashboard
      - key: DRIVE_FOLDER_ID
        sync: false          # set manually in Render dashboard
